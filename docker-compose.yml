services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pothole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pothole}
      POSTGRES_DB: ${POSTGRES_DB:-pothole_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pothole -d pothole_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pothole}:${POSTGRES_PASSWORD:-pothole}@db:5432/${POSTGRES_DB:-pothole_db}?schema=public"
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"

volumes:
  pgdata:
